<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>سه توپ — پیش‌نمایش بازی (main.gd v2.1)</title>
<style>
  html,body{margin:0;height:100%;background:#0b0806;overflow:hidden;
    font-family:"Vazirmatn","Segoe UI",Tahoma,system-ui,sans-serif;touch-action:none}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  #menu{position:fixed;inset:0;z-index:5;display:grid;place-items:center;
    padding:18px;box-sizing:border-box;background:rgba(8,6,5,.78);backdrop-filter:blur(5px)}
  #menu.hidden{display:none}
  .card{width:min(560px,92vw);padding:30px 28px;border:1px solid rgba(255,217,143,.28);
    border-radius:22px;background:linear-gradient(145deg,#392819,#21170f);color:#fff;
    box-shadow:0 24px 80px rgba(0,0,0,.5);text-align:center}
  .card h1{margin:0 0 8px;color:#ffe0a1;font-size:clamp(2rem,6vw,3.1rem)}
  .card p{margin:8px 0 22px;color:#ddd2c2;font-size:clamp(.95rem,2.6vw,1.1rem)}
  .move-row{display:flex;align-items:center;justify-content:center;gap:18px;margin:20px auto 26px}
  .move-row strong{min-width:220px;font-size:clamp(1.1rem,3.5vw,1.5rem)}
  button{font:inherit;color:#21170f;border:0;border-radius:12px;background:#e7c589;
    padding:12px 20px;min-height:48px;cursor:pointer;touch-action:manipulation}
  button:active{transform:scale(.97)}
  #move-minus,#move-plus{width:54px;padding:8px;font-size:1.5rem}
  #start-game{width:min(100%,420px);font-weight:700;background:#ffc866}
  .note{font-size:.85rem!important;color:#bfb4a4!important;margin:18px 0 0!important}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="menu">
  <section class="card" aria-label="منوی بازی">
    <h1>سه‌توپ</h1>
    <p>بازی دونفره؛ توپ را بکشید و از شکاف بین دو توپ دیگر عبور دهید.</p>
    <div class="move-row">
      <button id="move-minus" aria-label="کم کردن حرکت">−</button>
      <strong id="move-count">۳ حرکت در هر نوبت</strong>
      <button id="move-plus" aria-label="زیاد کردن حرکت">+</button>
    </div>
    <button id="start-game">شروع بازی</button>
    <p class="note">در صفحهٔ افقی، میز خودکار می‌چرخد. ماوس و لمس پشتیبانی می‌شوند.</p>
  </section>
</div>
<script>
"use strict";
/* ==================================================================
   آینهٔ مرورگری «سه توپ» — هم‌خوان با main.gd نسخهٔ ۲.۱
   همهٔ ثابت‌ها، هندسه و منطق داوری از main.gd گرفته شده‌اند.
   این فایل خودِ موتور Godot نیست؛ شبیه‌سازی قوانین برای تست تعادل است.
================================================================== */

// ------------------------------ ثابت‌های main.gd
const W = 1080, H = 1920;
const TABLE = {x:60, y:218, w:960, h:1542};
const GOAL  = {x:390, y:140, w:300, h:78};
const WALL  = 24;
const R = 36;
const MAX_DRAG = 320;
const IMPULSE = 10.0;
const DAMP = 2.0;
const STOP_SPEED = 12;
const WINNING_SCORE = 3;
const DEFAULT_MOVES_PER_TURN = 3;
const MIN_MOVES_PER_TURN = 1, MAX_MOVES_PER_TURN = 9;
let movesPerTurn = DEFAULT_MOVES_PER_TURN, configuredMoves = DEFAULT_MOVES_PER_TURN;

// پریست‌های تعادل (کلید ۱/۲/۳)
const QP = new URLSearchParams(location.search);
const PRESETS = {
  "1": {name:"main.gd (v2.1)",      ratio:0.62, damp:2.0,  imp:10.0},
  "2": {name:"سخت‌تر",               ratio:0.45, damp:2.0,  imp:10.0},
  "3": {name:"آسان‌تر",              ratio:0.75, damp:2.0,  imp:10.0},
};
let presetKey = QP.get("p") || "1";
if(!PRESETS[presetKey]) presetKey = "1";
const P = {...PRESETS[presetKey]};
if(QP.get("ratio")) P.ratio = +QP.get("ratio");
if(QP.get("damp"))  P.damp  = +QP.get("damp");
if(QP.get("imp"))   P.imp   = +QP.get("imp");

const ATTACK_Y = TABLE.y + TABLE.h * P.ratio;
const VMAX = MAX_DRAG * P.imp;
const FA=["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
const fa=n=>String(n).split("").map(c=>FA[+c]??c).join("");

// ------------------------------ وضعیت
const ST = {MENU:0, WAIT:1, MOVING:2, TRANS:3, OVER:4};
let state = ST.MENU;
let balls = [];
let activeBall = null, otherBalls = [], prevActive = {x:0,y:0}, shotOrigin = {x:0,y:0};
let gapCrossed = false, gateOpen = false, shotOpened = false;
let passLineA=null, passLineB=null;
let gateAnim = {l:390, r:540, lt:390, rt:540};
let dragging = false, dragBall = null, dragPos = {x:0,y:0};
let player = 1, scores = [0,0], movesLeft = movesPerTurn;
let shake = 0, parts = [], timers = [];
let statusText = "", turnText = "", banner = {text:"", color:"#fff", t:0, on:false};
let lastT = 0, timeAcc = 0;

const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a), dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const inRect=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;

// ------------------------------ دیواره‌ها (مثل _build_walls)
const WALLS = (()=>{
  const t=WALL, L=TABLE.x, Rt=TABLE.x+TABLE.w, T=TABLE.y, B=TABLE.y+TABLE.h;
  const ml=GOAL.x, mr=GOAL.x+GOAL.w;
  return [
    {x:L-t, y:T-t, w:t, h:(B-T)+2*t},
    {x:Rt,  y:T-t, w:t, h:(B-T)+2*t},
    {x:L-t, y:B,   w:(Rt-L)+2*t, h:t},
    {x:L-t, y:T-t, w:(ml-L)+t, h:t},
    {x:mr,  y:T-t, w:(Rt-mr)+t, h:t},
  ];
})();

// ------------------------------ صدا
let ac=null;
function audio(){
  if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ac=null; } }
  if(ac && ac.state==="suspended") ac.resume();
  return ac;
}
function sfx(f0,f1,dur,vol=0.22){
  const a=audio(); if(!a) return;
  const t=a.currentTime, o=a.createOscillator(), g=a.createGain();
  o.type="sine";
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+Math.min(0.012,dur*0.3));
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}

// ------------------------------ توپ‌ها
function makeBall(){
  const pts=[], blend=rnd(-2.6,2.6);
  for(let i=0;i<12;i++){
    const a=i*Math.PI*2/12;
    let r=R*rnd(0.86,1.04)*(1+0.10*Math.cos(a*2+blend));
    pts.push({x:Math.cos(a)*r, y:Math.sin(a)*r});
  }
  return {p:{x:0,y:0}, v:{x:0,y:0}, a:rnd(0,6.28), spin:0, pts};
}

// ------------------------------ جریان بازی
function setGate(open, instant){
  const changed = gateOpen !== open;
  gateOpen = open;
  gateAnim.lt = open ? GOAL.x - 150 : GOAL.x;
  gateAnim.rt = open ? GOAL.x + GOAL.w : GOAL.x + 150;
  if(instant){ gateAnim.l = gateAnim.lt; gateAnim.r = gateAnim.rt; }
  if(open && changed){
    burst(GOAL.x + GOAL.w/2, GOAL.y + 70, 26, "#40ffa6", 0.55, 120, 280);
    sfx(420, 880, 0.20); shake = Math.max(shake, 6);
  }
}
function gapOpenAt(p){
  const gl = gateAnim.l + 150, gr = gateAnim.r;
  return p.x > gl && p.x < gr;
}
function showBanner(text,color){ banner={text,color,t:0,on:true}; }
function afterDelay(sec, fn){ timers.push({t:sec, fn}); }

function startTurn(p){
  player = p;
  state = ST.WAIT;
  movesLeft = movesPerTurn;
  activeBall=null; otherBalls=[]; dragBall=null; dragging=false; gapCrossed=false;
  shotOpened=false; passLineA=null; passLineB=null;
  setGate(false, true);
  const base=[{x:360,y:1520},{x:540,y:1390},{x:720,y:1520}];
  balls.forEach((b,i)=>{
    b.p = {x: base[i].x + rnd(-18,18), y: base[i].y + rnd(-14,14)};
    b.v = {x:0,y:0}; b.spin=0; b.a=rnd(0,6.28);
  });
  statusText = "توپ را بکشید و از شکاف پاس رد کنید";
  showBanner("نوبت بازیکن " + fa(p), p===1 ? "#73c8ff" : "#ff8585");
  updateHud();
}
function startMatch(){
  scores=[0,0];
  startTurn(1);
}
function updateHud(){
  turnText = "نوبت " + fa(player) + " | حرکت " + fa(movesLeft) + "/" + fa(movesPerTurn)
           + " | دروازه " + (gateOpen ? "باز" : "قفل");
}

// ------------------------------ ذرات
function burst(x,y,n,color,life,vmin,vmax){
  for(let i=0;i<n;i++){
    const a=rnd(-Math.PI*0.15,Math.PI*1.15), sp=rnd(vmin,vmax);
    parts.push({x,y,vx:Math.cos(a)*sp*0.35,vy:Math.sin(a)*sp*0.55,
      life,max:life,color,size:rnd(4,15)});
  }
}

// ------------------------------ شوت
function shoot(ball, impulse){
  state = ST.MOVING;
  shotOrigin = {...ball.p};
  prevActive = {...ball.p};
  gapCrossed = false;
  otherBalls = balls.filter(b=>b!==ball);
  passLineA={...otherBalls[0].p}; passLineB={...otherBalls[1].p};
  shotOpened=false;
  ball.v.x += impulse.x; ball.v.y += impulse.y;
  ball.spin += rnd(-1400,1400)/900;
  sfx(280,150,0.08);
  statusText = "در حال حرکت...";
}

// ------------------------------ فیزیک
const DT = 1/120;
function stepPhysics(){
  for(const b of balls){
    b.p.x += b.v.x*DT; b.p.y += b.v.y*DT;
    b.a += b.spin*DT;
    const k = 1/(1+P.damp*DT);
    b.v.x *= k; b.v.y *= k;
    b.spin *= 1/(1+4.2*DT);
  }
  // توپ-توپ
  for(let i=0;i<3;i++) for(let j=i+1;j<3;j++){
    const A=balls[i], B=balls[j];
    let dx=B.p.x-A.p.x, dy=B.p.y-A.p.y, d=Math.hypot(dx,dy)||0.001;
    if(d < R*2){
      const nx=dx/d, ny=dy/d, push=(R*2-d)/2;
      A.p.x-=nx*push; A.p.y-=ny*push; B.p.x+=nx*push; B.p.y+=ny*push;
      const vn=(A.v.x-B.v.x)*nx + (A.v.y-B.v.y)*ny;
      if(vn>0){
        const j2=1.3*vn/2;
        A.v.x-=j2*nx; A.v.y-=j2*ny; B.v.x+=j2*nx; B.v.y+=j2*ny;
        if(state===ST.MOVING && activeBall && (A===activeBall||B===activeBall)){
          shake=Math.max(shake,7); sfx(160,95,0.13);
        }
      }
    }
  }
  // دیواره‌ها
  for(const b of balls) for(const w of WALLS){
    const cx=clamp(b.p.x,w.x,w.x+w.w), cy=clamp(b.p.y,w.y,w.y+w.h);
    let dx=b.p.x-cx, dy=b.p.y-cy, dd=Math.hypot(dx,dy);
    if(dd < R){
      if(dd<0.001){ dx=0; dy=-1; dd=1; }
      const nx=dx/dd, ny=dy/dd;
      b.p.x+=nx*(R-dd); b.p.y+=ny*(R-dd);
      const vn=b.v.x*nx + b.v.y*ny;
      if(vn<0){ b.v.x-=1.55*vn*nx; b.v.y-=1.55*vn*ny; }
    }
  }
  // درهای دروازه (AnimatableBody2D)
  for(const b of balls) for(const d of [{x:gateAnim.l,y:GOAL.y+GOAL.h-22},{x:gateAnim.r,y:GOAL.y+GOAL.h-22}]){
    const cx=clamp(b.p.x,d.x,d.x+150), cy=clamp(b.p.y,d.y,d.y+22);
    let dx=b.p.x-cx, dy=b.p.y-cy, dd=Math.hypot(dx,dy);
    if(dd<R){
      if(dd<0.001){ dx=0; dy=-1; dd=1; }
      const nx=dx/dd, ny=dy/dd;
      b.p.x+=nx*(R-dd); b.p.y+=ny*(R-dd);
      const vn=b.v.x*nx + b.v.y*ny;
      if(vn<0){ b.v.x-=1.55*vn*nx; b.v.y-=1.55*vn*ny; }
    }
  }
}

// ------------------------------ منطق شوت (آینهٔ _physics_process / _judge_shot)
function segInt(a,b,c,d){
  const D=(b.x-a.x)*(d.y-c.y)-(b.y-a.y)*(d.x-c.x);
  if(Math.abs(D)<1e-9) return false;
  const ua=((d.x-c.x)*(a.y-c.y)-(d.y-c.y)*(a.x-c.x))/D;
  const ub=((b.x-a.x)*(a.y-c.y)-(b.y-a.y)*(a.x-c.x))/D;
  return ua>=0 && ua<=1 && ub>=0 && ub<=1;
}
function onField(p){ return inRect(p,TABLE) || inRect(p,GOAL); }

function checkShot(){
  if(state!==ST.MOVING || !activeBall) return;
  const act = activeBall.p;

  // ۱) گل: از دهانهٔ باز رد شود
  if(act.y <= GOAL.y+GOAL.h+6 && act.x>=GOAL.x && act.x<=GOAL.x+GOAL.w && gapOpenAt(act)){
    burst(GOAL.x+GOAL.w/2, GOAL.y+40, 48, "#ffe066", 1.1, 220, 520);
    sfx(440,900,0.24); shake=Math.max(shake,14);
    finish("GOAL");
    return;
  }
  // ثبت عبور از شکاف
  if(!gapCrossed && passLineA && passLineB){
    if(segInt(prevActive, act, passLineA, passLineB)){
      gapCrossed = true; sfx(540,780,0.10);
    }
  }
  for(const b of balls){
    if(b.p.y < ATTACK_Y){ shotOpened=true; setGate(true); break; }
  }
  prevActive = {...act};

  // ۲) بیرون از زمین
  for(const b of balls){ if(!onField(b.p)){ finish("FOUL","خطا! توپ از روی میز بیرون افتاد."); return; } }

  // ۳) توقف کامل → داوری
  if(balls.every(b=>Math.hypot(b.v.x,b.v.y) <= STOP_SPEED)) judgeShot();
}

function judgeShot(){
  if(!activeBall) return;
  const act = activeBall.p;
  const crossed = gapCrossed || !!(passLineA && passLineB && segInt(shotOrigin,act,passLineA,passLineB));
  const opened = shotOpened || balls.some(b=>b.p.y < ATTACK_Y);
  const reachedGoal = act.y < GOAL.y + GOAL.h + R;

  if(opened) setGate(true);

  if(crossed && opened) return finish("PASS");
  if(opened)            return finish("OPENER");
  if(crossed)           return finish("PASS");
  if(reachedGoal)       return finish("FOUL","دروازه بسته بود! اول باید باز شود.");
  return finish("FOUL","سوختی! توپ از شکاف پاس رد نشد.");
}

function finish(kind, reason){
  if(kind==="GOAL"){
    scores[player-1] += 1;
    updateHud();
    if(scores[player-1] >= WINNING_SCORE){
      state = ST.OVER;
      statusText = "بازیکن " + fa(player) + " برنده شد!";
      showBanner("قهرمان: بازیکن " + fa(player), "#4dff80");
    } else {
      state = ST.TRANS;
      statusText = "گل برای بازیکن " + fa(player) + "!";
      showBanner("گلللل!", "#4dff80");
      afterDelay(1.8, ()=>{ if(state===ST.TRANS) startTurn(player===1?2:1); });
    }
    return;
  }
  if(kind==="FOUL"){
    shake=Math.max(shake,8); sfx(220,110,0.20);
    aftermath(reason || "خطا!");
    return;
  }
  if(kind==="PASS") sfx(540,780,0.10);
  movesLeft -= 1;
  if(movesLeft <= 0){
    state = ST.TRANS;
    statusText = "حرکت‌های مجاز تمام شد؛ نوبت حریف.";
    showBanner("پایان نوبت", "#ffd477");
    updateHud();
    afterDelay(1.2, ()=>{ if(state===ST.TRANS) startTurn(player===1?2:1); });
  } else {
    state = ST.WAIT;
    if(kind==="OPENER" || gateOpen){
      statusText = "دروازه باز شد! حالا شوت بزنید!";
      showBanner("دروازه باز شد!", "#4dffa6");
    } else {
      statusText = "پاس صحیح! حرکت بعدی.";
      showBanner("پاس صحیح", "#73f2ff");
    }
    updateHud();
  }
}
function aftermath(reason){
  state = ST.TRANS;
  statusText = reason;
  showBanner("نوبت سوخت", "#ff6161");
  updateHud();
  afterDelay(1.5, ()=>{ if(state===ST.TRANS) startTurn(player===1?2:1); });
}

// ------------------------------ ورودی
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const menuEl = document.getElementById("menu");
const moveCountEl = document.getElementById("move-count");
const startGameEl = document.getElementById("start-game");
let scale=1, ox=0, oy=0, dpr=1, landscape=false;

function screenPoint(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale};
}
function toDesign(e){
  const p=screenPoint(e);
  return landscape ? {x:p.y,y:H-p.x} : p;
}
function hitReset(p){
  return landscape ? p.x>=1500&&p.x<=1740&&p.y<=95 : p.x>=752&&p.x<=956&&p.y<=100;
}
function hitMenu(p){
  return landscape ? p.x>=1760&&p.x<=1895&&p.y<=95 : p.x>=968&&p.x<=1062&&p.y<=100;
}
function updateMoveCount(){ moveCountEl.textContent=fa(configuredMoves)+" حرکت در هر نوبت"; }
function showMenu(){
  state=ST.MENU; dragging=false; dragBall=null; activeBall=null;
  for(const b of balls){ b.v={x:0,y:0}; b.spin=0; }
  menuEl.classList.remove("hidden");
  startGameEl.textContent=scores.some(n=>n>0)?"شروع دوباره":"شروع بازی";
}
function hideMenuAndStart(){
  movesPerTurn=configuredMoves;
  menuEl.classList.add("hidden");
  startMatch();
}
document.getElementById("move-minus").addEventListener("click",()=>{
  configuredMoves=Math.max(MIN_MOVES_PER_TURN,configuredMoves-1); updateMoveCount();
});
document.getElementById("move-plus").addEventListener("click",()=>{
  configuredMoves=Math.min(MAX_MOVES_PER_TURN,configuredMoves+1); updateMoveCount();
});
startGameEl.addEventListener("click",hideMenuAndStart);
updateMoveCount();

function onDown(e){
  e.preventDefault();
  audio();
  const screen=screenPoint(e);
  if(hitMenu(screen)){ showMenu(); return; }
  if(hitReset(screen)){
    if(state===ST.OVER) startMatch();
    else if(state!==ST.MENU) startTurn(player===1?2:1);
    return;
  }
  if(state!==ST.WAIT) return;
  const p=toDesign(e);
  let best=null, bestD=R*1.8;
  for(const b of balls){
    const d=dist(b.p,p);
    if(d<=bestD){ bestD=d; best=b; }
  }
  dragBall=best; activeBall=best; dragging=best!==null;
  if(dragging){ dragPos=p; sfx(720,760,0.05,0.08); }
}
function onMove(e){
  if(!dragging || !dragBall) return;
  e.preventDefault();
  dragPos=toDesign(e);
}
function onUp(e){
  if(!dragging || !dragBall) return;
  dragging=false;
  const p=toDesign(e);
  const pull={x:dragBall.p.x-p.x,y:dragBall.p.y-p.y};
  const len=Math.hypot(pull.x,pull.y);
  if(len>24){
    const k=Math.min(len,MAX_DRAG)/len;
    shoot(dragBall,{x:pull.x*k*P.imp,y:pull.y*k*P.imp});
  } else activeBall=null;
  dragBall=null;
}
cv.addEventListener("pointerdown",onDown,{passive:false});
cv.addEventListener("pointermove",onMove,{passive:false});
window.addEventListener("pointerup",onUp);
window.addEventListener("keydown",e=>{
  if(["1","2","3"].includes(e.key)) location.search="?p="+e.key;
  if(e.key==="Escape") showMenu();
});

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const cw=window.innerWidth,ch=window.innerHeight;
  cv.width=Math.floor(cw*dpr); cv.height=Math.floor(ch*dpr);
  landscape=cw>ch;
  if(landscape){
    scale=Math.min(cw/H,ch/W);
    ox=(cw-H*scale)/2; oy=(ch-W*scale)/2;
  } else {
    scale=Math.min(cw/W,ch/H);
    ox=(cw-W*scale)/2; oy=(ch-H*scale)/2;
  }
}
window.addEventListener("resize",resize);

// ------------------------------ رندر
function rr(x,y,w,h,c){
  ctx.beginPath(); ctx.moveTo(x+c,y);
  ctx.arcTo(x+w,y,x+w,y+h,c); ctx.arcTo(x+w,y+h,x,y+h,c);
  ctx.arcTo(x,y+h,x,y,c); ctx.arcTo(x,y,x+w,y,c); ctx.closePath();
}
function mix(c1,c2,t){
  const p=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  const a=p(c1), b=p(c2);
  return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;
}

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle="#0b0806"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save();
  const sx = shake>0.1 ? rnd(-shake,shake) : 0;
  const sy = shake>0.1 ? rnd(-shake,shake) : 0;
  ctx.setTransform(dpr*scale,0,0,dpr*scale,(ox+sx*scale)*dpr,(oy+sy*scale)*dpr);
  if(landscape){ ctx.translate(H,0); ctx.rotate(Math.PI/2); }

  // زمین
  ctx.fillStyle="#171009"; ctx.fillRect(0,0,W,H);

  // میز
  ctx.fillStyle="rgba(0,0,0,0.40)";
  ctx.fillRect(TABLE.x+16,TABLE.y+20,TABLE.w,TABLE.h);
  ctx.fillStyle="#54341d";
  ctx.fillRect(TABLE.x-14,TABLE.y-14,TABLE.w+28,TABLE.h+28);
  ctx.fillStyle="#734a2a";
  ctx.fillRect(TABLE.x-14,TABLE.y-14,TABLE.w+28,4);
  ctx.fillStyle="#763c1f";
  ctx.fillStyle="#764d2b";
  ctx.fillRect(TABLE.x,TABLE.y,TABLE.w,TABLE.h);

  // رگه‌های چوب
  ctx.fillStyle="rgba(102,63,34,0.45)";
  for(let i=1;i<8;i++) ctx.fillRect(TABLE.x+i*120,TABLE.y,3,TABLE.h);

  // نوار ناحیهٔ هجومی
  ctx.fillStyle="rgba(255,219,77,0.055)";
  ctx.fillRect(TABLE.x,TABLE.y,TABLE.w,ATTACK_Y-TABLE.y);

  // خط هجوم
  ctx.strokeStyle="rgba(255,224,77,0.70)"; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(TABLE.x,ATTACK_Y); ctx.lineTo(TABLE.x+TABLE.w,ATTACK_Y); ctx.stroke();
  ctx.fillStyle="rgba(255,224,77,0.85)"; ctx.font="22px Vazirmatn,Tahoma,sans-serif";
  ctx.textAlign="left"; ctx.direction="rtl";
  ctx.fillText("خط باز شدن دروازه", TABLE.x+16, ATTACK_Y-10);

  // دروازه
  ctx.fillStyle="#123d26"; ctx.fillRect(GOAL.x-16,GOAL.y-16,GOAL.w+32,GOAL.h+18);
  ctx.fillStyle="#1c7f49"; ctx.fillRect(GOAL.x,GOAL.y,GOAL.w,GOAL.h);
  ctx.strokeStyle="rgba(255,255,255,0.13)"; ctx.lineWidth=1.5;
  for(let x=GOAL.x;x<=GOAL.x+GOAL.w;x+=24){
    ctx.beginPath(); ctx.moveTo(x,GOAL.y); ctx.lineTo(x,GOAL.y+GOAL.h); ctx.stroke();
  }
  for(let y=GOAL.y;y<=GOAL.y+GOAL.h;y+=19){
    ctx.beginPath(); ctx.moveTo(GOAL.x,y); ctx.lineTo(GOAL.x+GOAL.w,y); ctx.stroke();
  }
  // خط دروازه
  ctx.strokeStyle="rgba(89,255,140,0.55)"; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(GOAL.x,GOAL.y+GOAL.h+6); ctx.lineTo(GOAL.x+GOAL.w,GOAL.y+GOAL.h+6); ctx.stroke();

  // LEDها
  const led = gateOpen ? "#40ff6b" : "#ff2e2e";
  ctx.shadowColor=led; ctx.shadowBlur=18; ctx.fillStyle=led;
  ctx.fillRect(GOAL.x-30,GOAL.y+40,20,20); ctx.fillRect(GOAL.x+GOAL.w+10,GOAL.y+40,20,20);
  ctx.shadowBlur=0;

  // شکاف پاس
  if(dragging && dragBall){
    const others = balls.filter(b=>b!==dragBall);
    ctx.strokeStyle="rgba(64,235,255,0.60)"; ctx.lineWidth=6;
    ctx.setLineDash([16,12]); ctx.lineDashOffset = -performance.now()/40;
    ctx.beginPath();
    ctx.moveTo(others[0].p.x,others[0].p.y); ctx.lineTo(others[1].p.x,others[1].p.y);
    ctx.stroke(); ctx.setLineDash([]);
  }

  // خط نشانه‌گیری + نوک
  if(dragging && dragBall){
    const pull={x:dragBall.p.x-dragPos.x, y:dragBall.p.y-dragPos.y};
    const len=Math.hypot(pull.x,pull.y);
    if(len>8){
      const k=Math.min(len,MAX_DRAG)/len;
      const ratio=Math.min(len,MAX_DRAG)/MAX_DRAG;
      const col=mix("#40ff73","#ff4738",ratio);
      const tipX=dragBall.p.x+pull.x*k, tipY=dragBall.p.y+pull.y*k;
      ctx.strokeStyle=col; ctx.lineWidth=9; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(dragBall.p.x,dragBall.p.y); ctx.lineTo(tipX,tipY); ctx.stroke();
      const ang=Math.atan2(pull.y,pull.x);
      ctx.save(); ctx.translate(tipX,tipY); ctx.rotate(ang);
      ctx.fillStyle=col; ctx.beginPath();
      ctx.moveTo(0,-14); ctx.lineTo(22,0); ctx.lineTo(0,14); ctx.closePath(); ctx.fill();
      ctx.restore();
      // سنجهٔ قدرت
      ctx.fillStyle="rgba(0,0,0,0.35)"; rr(TABLE.x+20,TABLE.y+TABLE.h-56,TABLE.w-40,22,11); ctx.fill();
      ctx.fillStyle=col; rr(TABLE.x+20,TABLE.y+TABLE.h-56,(TABLE.w-40)*ratio,22,11); ctx.fill();
    }
  }

  // درها
  drawDoor(gateAnim.l); drawDoor(gateAnim.r);

  // توپ‌ها
  for(const b of balls) drawBall(b);

  // ذرات
  for(const p of parts){
    const a=clamp(p.life/p.max,0,1);
    ctx.globalAlpha=a; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*a,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();
  drawHud();
}

function drawDoor(x){
  const y = GOAL.y+GOAL.h-22;
  ctx.fillStyle="rgba(0,0,0,0.35)"; ctx.fillRect(x+5,y+6,150,22);
  ctx.fillStyle="#d13038"; ctx.fillRect(x,y,150,22);
  ctx.fillStyle="rgba(255,199,61,0.92)"; ctx.fillRect(x+8,y+8,134,5);
}
function drawBall(b){
  ctx.save();
  ctx.translate(b.p.x,b.p.y);
  ctx.save(); ctx.translate(6,8);
  ctx.beginPath();
  b.pts.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.closePath(); ctx.fillStyle="rgba(0,0,0,0.30)"; ctx.fill(); ctx.restore();
  ctx.rotate(b.a);
  ctx.beginPath();
  b.pts.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.closePath();
  ctx.fillStyle="#f7f5ea"; ctx.fill();
  ctx.strokeStyle="rgba(199,189,163,0.9)"; ctx.lineWidth=2; ctx.stroke();
  ctx.strokeStyle="rgba(92,140,217,0.42)"; ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(b.pts[1].x*0.62,b.pts[1].y*0.62);
  ctx.lineTo(0,0); ctx.lineTo(b.pts[5].x*0.68,b.pts[5].y*0.68);
  ctx.lineTo(b.pts[8].x*0.58,b.pts[8].y*0.58); ctx.stroke();
  ctx.restore();
  if(b===dragBall && dragging){
    ctx.beginPath(); ctx.arc(b.p.x,b.p.y,R+12,0,6.2832);
    ctx.setLineDash([8,8]); ctx.strokeStyle="rgba(64,255,115,0.55)";
    ctx.lineWidth=3; ctx.stroke(); ctx.setLineDash([]);
  }
}

function drawHud(){
  ctx.save();
  ctx.setTransform(dpr*scale,0,0,dpr*scale,ox*dpr,oy*dpr);
  if(landscape){ drawHudLandscape(); ctx.restore(); return; }
  ctx.direction="rtl"; ctx.textBaseline="middle";
  ctx.fillStyle="rgba(15,12,10,0.94)"; ctx.fillRect(0,0,W,118);

  ctx.font="32px Vazirmatn,Tahoma,sans-serif"; ctx.textAlign="right";
  ctx.fillStyle="#73c8ff";
  ctx.fillText((player===1?"▶ ":"   ")+"بازیکن ۱: "+fa(scores[0]), 330, 34);
  ctx.fillStyle="#ff8585";
  ctx.fillText((player===2?"▶ ":"   ")+"بازیکن ۲: "+fa(scores[1]), 330, 78);

  ctx.fillStyle="#f2f2f2"; ctx.font="27px Vazirmatn,Tahoma,sans-serif";
  ctx.fillText(turnText, 1060, 32);
  ctx.fillStyle="#ffe66b"; ctx.font="24px Vazirmatn,Tahoma,sans-serif";
  ctx.fillText(statusText, 1060, 76);

  // سنجهٔ دروازه
  ctx.fillStyle="rgba(255,255,255,0.16)"; ctx.fillRect(356,98,240,10);
  ctx.fillStyle = gateOpen?"#4dff80":"#ff5a5a";
  ctx.fillRect(356,98,gateOpen?240:0,10);

  // دکمه‌های تعویض نوبت و منو
  ctx.fillStyle="rgba(240,240,245,0.94)"; rr(752,18,204,82,12); ctx.fill();
  ctx.fillStyle="#1a1a1a"; ctx.font="19px Vazirmatn,Tahoma,sans-serif"; ctx.textAlign="center";
  ctx.fillText(state===ST.OVER?"بازی جدید":"تعویض نوبت", 854, 59);
  ctx.fillStyle="rgba(240,240,245,0.94)"; rr(968,18,94,82,12); ctx.fill();
  ctx.fillStyle="#1a1a1a"; ctx.font="20px Vazirmatn,Tahoma,sans-serif";
  ctx.fillText("منو",1015,59);

  // بنر
  if(banner.on){
    const t=banner.t;
    let sc=1, al=1;
    if(t<0.18) sc=lerp(0.72,1.04,t/0.18);
    else if(t<0.98) sc=1.04;
    else al=1-(t-0.98)/0.32;
    ctx.save(); ctx.translate(W/2,965); ctx.scale(sc,sc);
    ctx.globalAlpha=clamp(al,0,1);
    ctx.font="bold 58px Vazirmatn,Tahoma,sans-serif"; ctx.textAlign="center";
    ctx.lineWidth=10; ctx.strokeStyle="rgba(0,0,0,0.55)";
    ctx.strokeText(banner.text,0,0);
    ctx.fillStyle=banner.color; ctx.fillText(banner.text,0,0);
    ctx.restore(); ctx.globalAlpha=1;
  }

  // پانل تعادل (پایین)
  ctx.direction="rtl"; ctx.textAlign="right";
  ctx.font="21px Vazirmatn,Tahoma,sans-serif";
  const need = Math.round(1390 - ATTACK_Y), reach = Math.round(VMAX/P.damp);
  const ok = need <= reach;
  ctx.fillStyle="rgba(0,0,0,0.55)"; rr(60,1690,700,150,14); ctx.fill();
  const lines=[
    "پریست "+presetKey+" · "+P.name+" · خط هجوم y="+fa(Math.round(ATTACK_Y)),
    "بُرد شوت ≈ "+fa(reach)+"px  |  لازم از شروع: "+fa(need)+"px",
    ok ? "✓ شوت طلایی (پاس+دروازه) ممکن است" : "✗ خط هجوم از دسترس خارج است",
    "کلید ۱ / ۲ / ۳ = پریست‌های تعادل"
  ];
  lines.forEach((s,i)=>{
    ctx.fillStyle = i===2 ? (ok?"#5cff9d":"#ff6b6b") : (i===3?"rgba(255,255,255,0.5)":"rgba(255,255,255,0.87)");
    ctx.fillText(s, 740, 1720+i*30);
  });
  ctx.direction="ltr";
  ctx.restore();
}

function drawHudLandscape(){
  ctx.direction="rtl"; ctx.textBaseline="middle";
  ctx.fillStyle="rgba(15,12,10,0.94)"; ctx.fillRect(0,0,1920,112);
  ctx.textAlign="right"; ctx.font="25px Vazirmatn,Tahoma,sans-serif";
  ctx.fillStyle="#73c8ff"; ctx.fillText((player===1?"▶ ":"   ")+"بازیکن ۱: "+fa(scores[0]),294,30);
  ctx.fillStyle="#ff8585"; ctx.fillText((player===2?"▶ ":"   ")+"بازیکن ۲: "+fa(scores[1]),294,75);
  ctx.fillStyle="#f2f2f2"; ctx.font="24px Vazirmatn,Tahoma,sans-serif";
  ctx.fillText(turnText,930,30);
  ctx.fillStyle="#ffe66b"; ctx.font="20px Vazirmatn,Tahoma,sans-serif";
  ctx.fillText(statusText,930,73);
  ctx.fillStyle="rgba(255,255,255,0.16)"; ctx.fillRect(330,96,250,9);
  ctx.fillStyle=gateOpen?"#4dff80":"#ff5a5a"; ctx.fillRect(330,96,gateOpen?250:0,9);

  ctx.fillStyle="rgba(240,240,245,0.94)"; rr(1500,13,240,78,12); ctx.fill();
  ctx.fillStyle="#1a1a1a"; ctx.font="19px Vazirmatn,Tahoma,sans-serif"; ctx.textAlign="center";
  ctx.fillText(state===ST.OVER?"بازی جدید":"تعویض نوبت",1620,53);
  ctx.fillStyle="rgba(240,240,245,0.94)"; rr(1760,13,135,78,12); ctx.fill();
  ctx.fillStyle="#1a1a1a"; ctx.font="20px Vazirmatn,Tahoma,sans-serif";
  ctx.fillText("منو",1827,53);
  if(banner.on){
    ctx.font="bold 54px Vazirmatn,Tahoma,sans-serif"; ctx.textAlign="center";
    ctx.fillStyle=banner.color; ctx.fillText(banner.text,960,560);
  }
  ctx.direction="ltr";
}

// ------------------------------ حلقهٔ اصلی
function frame(now){
  if(!lastT) lastT=now;
  let dt=Math.min((now-lastT)/1000,0.05);
  lastT=now;

  for(let i=timers.length-1;i>=0;i--){
    timers[i].t-=dt;
    if(timers[i].t<=0){ const f=timers[i].fn; timers.splice(i,1); f(); }
  }
  const sp=1-Math.pow(0.001,dt);
  gateAnim.l=lerp(gateAnim.l,gateAnim.lt,sp);
  gateAnim.r=lerp(gateAnim.r,gateAnim.rt,sp);

  if(state===ST.MOVING){
    timeAcc+=dt;
    let guard=0;
    while(timeAcc>=DT && guard++<40){
      stepPhysics(); checkShot(); timeAcc-=DT;
      if(state!==ST.MOVING) break;
    }
  }
  shake = shake>0.1 ? lerp(shake,0,1-Math.pow(0.0001,dt)) : 0;

  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vy+=260*dt; p.vx*=1-2.2*dt; p.vy*=1-1.1*dt;
    p.life-=dt;
    if(p.life<=0) parts.splice(i,1);
  }
  if(banner.on){ banner.t+=dt; if(banner.t>1.3) banner.on=false; }

  draw();
  requestAnimationFrame(frame);
}

// ------------------------------ راه‌اندازی
resize();
balls=[makeBall(),makeBall(),makeBall()];
showMenu();
requestAnimationFrame(frame);
</script>
